# Full stack for the astro-numerology app.
#
# Local dev:  docker compose up -d postgres      (run web via `bun run dev`)
# Deploy:     docker compose --profile tools build
#             docker compose run --rm migrate     (apply DB migrations)
#             docker compose up -d
#
# The `--profile tools` is load-bearing: `migrate` sits in that profile, so a
# plain `docker compose build` skips it, and `run` only builds an image that is
# missing. A stale migrate image from an earlier deploy therefore applies the
# migrations it was built with, reports success, and leaves the newer ones
# unapplied — a green deploy on top of a half-migrated database.
#
# External dependencies NOT in this compose: the Qwen LLM (separate llama.cpp
# server) and geocoding (public Nominatim). Configure via the env vars below.
services:
  postgres:
    image: postgres:16-alpine
    container_name: astro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astro}
      POSTGRES_DB: astro
    # Bound to localhost only (not exposed publicly). 5433 avoids a native
    # Postgres that may already hold 5432 on the host.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - astro-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro -d astro"]
      interval: 5s
      timeout: 5s
      retries: 10

  astro-service:
    build: ./astro-service
    restart: unless-stopped
    environment:
      # Primary geocoder: the public OSM Nominatim. A secondary instance can be
      # added via NOMINATIM_FALLBACK_URL; empty disables it.
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_FALLBACK_URL: ${NOMINATIM_FALLBACK_URL:-}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-astro-numerology-app/1.0}
      GEOCODING_LANGUAGE: ${GEOCODING_LANGUAGE:-ru}
      # Outbound budget, requests/second. Defaults to 1 because the default
      # NOMINATIM_URL above is the PUBLIC OSM instance, whose policy is 1 req/s
      # per application across all users. Set to 0 only when NOMINATIM_URL
      # points at an instance you own.
      NOMINATIM_RATE_LIMIT: ${NOMINATIM_RATE_LIMIT:-1}
      NOMINATIM_FALLBACK_RATE_LIMIT: ${NOMINATIM_FALLBACK_RATE_LIMIT:-1}
      # Merge both instances instead of stopping at the first non-empty answer.
      # Only safe to disable when NOMINATIM_URL covers the whole planet.
      GEOCODING_MERGE_SOURCES: ${GEOCODING_MERGE_SOURCES:-true}
      GEOCODING_QUEUE_MAX_WAIT: ${GEOCODING_QUEUE_MAX_WAIT:-8}
      GEOCODING_CACHE_SIZE: ${GEOCODING_CACHE_SIZE:-5000}
      GEOCODING_CACHE_TTL: ${GEOCODING_CACHE_TTL:-86400}
    expose:
      - "8000"

  # One-shot migration runner (uses the bun `base` stage). Not started by
  # `up`; invoke with `docker compose run --rm migrate`.
  migrate:
    build:
      context: ./web
      target: base
    command: bun run db:migrate
    environment:
      NUXT_DATABASE_URL: postgres://astro:${POSTGRES_PASSWORD:-astro}@postgres:5432/astro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
    restart: "no"

  web:
    build:
      context: ./web
      target: runtime
    restart: unless-stopped
    environment:
      NUXT_DATABASE_URL: postgres://astro:${POSTGRES_PASSWORD:-astro}@postgres:5432/astro
      NUXT_ASTRO_SERVICE_URL: http://astro-service:8000
      # LLM endpoint comes from .env / CI secret — not committed. Required.
      NUXT_LLM_BASE_URL: ${NUXT_LLM_BASE_URL:?NUXT_LLM_BASE_URL is required}
      NUXT_LLM_API_KEY: ${NUXT_LLM_API_KEY:-}
      # One GPU behind the LLM — keep concurrency low and reject rather than
      # let callers pile up invisibly inside llama.cpp.
      NUXT_LLM_CONCURRENCY: ${NUXT_LLM_CONCURRENCY:-1}
      NUXT_LLM_QUEUE_MAX_WAIT_MS: ${NUXT_LLM_QUEUE_MAX_WAIT_MS:-60000}
      NUXT_LLM_QUEUE_MAX_SIZE: ${NUXT_LLM_QUEUE_MAX_SIZE:-50}
      # Bot API (/api/bot/*) and Telegram Mini App auth. Both come from .env.
      NUXT_BOT_API_KEY: ${NUXT_BOT_API_KEY:-}
      NUXT_TELEGRAM_BOT_TOKEN: ${NUXT_TELEGRAM_BOT_TOKEN:-}
      NUXT_APP_URL: ${NUXT_APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      astro-service:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:3000"

  # Telegram bot. Long polling, so it dials out and needs no published port and
  # no public address of its own.
  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      # The SAME bot as NUXT_TELEGRAM_BOT_TOKEN below — the web app's Mini App
      # auth verifies initData against that token, so a mismatch means every
      # /setup request is rejected as an invalid signature.
      #
      # Passed through with a soft default rather than `:?`: a hard requirement
      # here fails *every* compose command, including `docker compose up -d
      # postgres` for local development. The bot validates its own config at
      # startup and says exactly what is missing.
      BOT_TOKEN: ${NUXT_TELEGRAM_BOT_TOKEN:-}
      # Internal address of the Nuxt layer; never leaves the compose network.
      API_BASE_URL: http://web:3000
      BOT_API_KEY: ${NUXT_BOT_API_KEY:-}
      POLL_INTERVAL_MS: ${BOT_POLL_INTERVAL_MS:-2000}
      POLL_TIMEOUT_MS: ${BOT_POLL_TIMEOUT_MS:-180000}
      # Proxy for api.telegram.org where Telegram is blocked. Applied to
      # Telegram traffic ONLY — never to API_BASE_URL above.
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      # Belt and braces: if the host exports HTTP_PROXY/HTTPS_PROXY, Bun's fetch
      # honours them and would send the INTERNAL API calls through the proxy
      # too. Those then hang until they time out, which for an inline query
      # means the picker spins and never resolves.
      NO_PROXY: web,localhost,127.0.0.1
      no_proxy: web,localhost,127.0.0.1
    depends_on:
      web:
        condition: service_started

volumes:
  astro-pgdata:
